[versions]
agp = "9.2.1"
kotlin = "2.1.0"
icu4j = "76.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
# Readium Kotlin Toolkit. Authoritative latest = repo1.maven.org maven-metadata.xml
# (<release>3.3.0</release>, lastUpdated 20260602). search.maven.org's solr index lagged.
# Highest version empirically verified to build against this toolchain. See spike findings.
readium = "3.3.0"
# Core library desugaring runtime — required by Readium (uses java.time / java.nio APIs).
desugarJdkLibs = "2.1.5"
# Jetpack Compose — verified via Google Maven (dl.google.com/dl/android/maven2 metadata).
# BOM 2026.06.00 ships Material 3 1.4.0 (Expressive). Latest stable as of 2026-06-23.
composeBom = "2026.06.00"
# activity-compose 1.13.0: latest stable per Google Maven metadata as of 2026-06-23.
activityCompose = "1.13.0"
# Kotlin version bundled by AGP 9.2.1 (confirmed via gradle-9.2.1.pom dependency).
# The Compose compiler plugin version MUST match the Kotlin compiler version in use.
kotlinBuiltIn = "2.2.10"
# Hilt 2.59.2: latest stable per Maven Central as of 2026-06-23.
hilt = "2.59.2"
# KSP version format: <kotlinVersion>-<kspPatch>. 2.2.10-2.0.2 matches Kotlin 2.2.10.
# Verified present at repo1.maven.org/maven2/com/google/devtools/ksp.
ksp = "2.2.10-2.0.2"
# navigation-compose 2.9.8: latest stable per Google Maven as of 2026-06-23 (not in BOM).
navigationCompose = "2.9.8"
# Room 2.8.4: latest stable per Google Maven as of 2026-06-23.
room = "2.8.4"
# DataStore 1.2.1: latest stable per Google Maven as of 2026-06-23.
datastore = "1.2.1"
# Robolectric 4.16.1: latest stable per Maven Central as of 2026-06-23.
# android-all jars exist up to SDK 35; SDK 36 NOT yet supported — @Config(sdk=[35]) required.
robolectric = "4.16.1"
# coroutines-test 1.11.0: latest stable per Maven Central as of 2026-06-23.
coroutinesTest = "1.11.0"
# androidx.test:core 1.7.0: latest stable per Google Maven as of 2026-06-23.
androidxTestCore = "1.7.0"
# Coil 3 image loading library — latest stable from repo1.maven.org as of 2026-06-23.
coil = "3.3.0"
# hilt-navigation-compose 1.2.0: latest stable per Google Maven as of 2026-06-23.
hiltNavigationCompose = "1.2.0"
# lifecycle-viewmodel-compose 2.9.1: latest stable per Google Maven as of 2026-06-23.
lifecycleViewmodelCompose = "2.9.1"
# Turbine 1.2.1: latest stable per Maven Central as of 2026-06-23.
turbine = "1.2.1"
jsoup = "1.18.3"
# media3 1.10.1: Jetpack Media3 for background playback (replaces readium-navigator-media-tts)
media3 = "1.10.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
icu4j = { group = "com.ibm.icu", name = "icu4j", version.ref = "icu4j" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
# Compose libraries (versions managed via BOM — no explicit version on individual artifacts)
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# material-icons-core: BOM-managed; provides ~150 common Filled/Outlined icons (Settings,
# PlayArrow, List, etc.) without the ~4 MB extended set.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# material-icons-extended: BOM-managed; full icon set (~2000 icons) including Tune used in
# the reader settings action. R8 tree-shakes unused icons in release builds.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Readium Kotlin Toolkit (group: org.readium.kotlin-toolkit). All on Maven Central.
readium-shared = { group = "org.readium.kotlin-toolkit", name = "readium-shared", version.ref = "readium" }
readium-streamer = { group = "org.readium.kotlin-toolkit", name = "readium-streamer", version.ref = "readium" }
readium-navigator = { group = "org.readium.kotlin-toolkit", name = "readium-navigator", version.ref = "readium" }

# media3 — Jetpack Media3 for background playback (replaces readium-navigator-media-tts)
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Hilt DI (versions managed via hilt version ref above)
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
# Jetpack Navigation for Compose (not in BOM — explicit version required)
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Room (KSP-based code generation)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Test dependencies for Robolectric / Room unit tests
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# Coil 3 — async image loading for Compose
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
# Hilt navigation integration for Compose (hiltViewModel() + NavHost)
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
# ViewModel delegate for Compose (viewModel() in composable functions)
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
# Turbine — coroutine Flow testing
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
# jsoup — HTML/XML parser for Thai ZWSP injection in EPUB content resources
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# Compose compiler plugin — required for Kotlin 2.0+ (Kotlin 2.2.10 is bundled by AGP 9.2.1).
# Version must match the actual Kotlin compiler version in use (kotlinBuiltIn above).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinBuiltIn" }
# Hilt Gradle plugin — version must match hilt-android dependency above.
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
# KSP — annotation processor for Hilt (and future uses). Version: <kotlin>-<kspPatch>.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

