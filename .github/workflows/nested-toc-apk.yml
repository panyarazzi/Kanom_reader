name: Kanom Reader APK

on:
  push:
    branches:
      - feature/reader-improvements-apk2
      - feature/portable-data-folder-apk1
      - feature/ux-ui-completion-no-highlight
      - feature/apk62-status-preview-branding # APK 62
      - feature/apk63-reader-progress-numeric-settings # APK 64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK using workflow APK number
        env:
          APK_NUMBER: ${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Kanom-Reader-apk${APK_NUMBER}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kanom-Reader-apk${{ github.run_number }}
          path: app/build/outputs/apk/debug/Kanom-Reader-apk${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7
